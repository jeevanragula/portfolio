version: 1

name: jeevan-career-os

source_of_truth:
  file: data/career.json
  schema: data/career.schema.json

pipeline:
  - id: intake
    agent: agents/01-intake-agent.md
    purpose: normalize_new_career_information
  - id: fact_privacy
    agent: agents/02-fact-privacy-agent.md
    purpose: validate_facts_and_publication_safety
    gate: required
  - id: career_content
    agent: agents/03-career-content-agent.md
    purpose: update_career_source_of_truth
  - id: portfolio_sync
    agent: agents/04-portfolio-sync-agent.md
    purpose: synchronize_presentation_layer_when_needed
  - id: qa
    agent: agents/05-qa-agent.md
    purpose: validate_data_and_browser_behavior
    gate: required
  - id: release
    agent: agents/06-release-agent.md
    purpose: publish_approved_change
    gate: required

approval:
  default_mode: assisted
  auto_release_allowed:
    - typo_fix
    - explicit_link_fix
    - explicit_date_or_title_correction
  manual_review_required:
    - ambiguous_fact
    - confidential_or_sensitive_information
    - new_public_claim
    - architecture_change
    - design_change
    - new_external_integration

deployment:
  provider: vercel
  trigger: github_push
  branch: main

principles:
  - career.json_is_source_of_truth
  - do_not_invent_facts
  - do_not_publish_confidential_information
  - preserve_existing_design
  - validate_before_release
